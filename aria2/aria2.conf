# ==============================================================
# aria2 配置文件 — 完整选项参考
# 每个选项都包含: 用途说明 | 可设置的值 | 默认值
# 去掉行首的 ## 即可启用某个选项（保持原本的 # 则不变）
# ==============================================================

# ======================== 1. 基本设置 ========================

## 下载存储目录（所有文件会存到这里）
dir=/Users/dax/Downloads/

## 继续下载未完成的文件（断点续传）。仅 Http(s)/FTP 有效
## 值: true | false
## 默认: false
continue=true

## 最大并行下载任务数（同时下载几个文件）
## 值: 1-*（正整数）
## 默认: 5
max-concurrent-downloads=5

## 强制顺序下载（逐个下载，不并行）
## 如果启用 -Z 行为，则依次下载每个链接
## 值: true | false
## 默认: false
# force-sequential=false

## 参数化 URI 支持。允许 {sv1,sv2} 或 image[001-100:2].img 格式
## 值: true | false
## 默认: false
# parameterized-uri=false

## 每个下载文件允许拆分到的最大段数
## 值: 1-*
## 默认: 5
split=16

## 最小拆分大小。文件小于 2*此值时不会拆分
## 值: 1M-1024M
## 默认: 20M
min-split-size=1M

## 每个服务器最大连接数（HTTP/FTP）
## 值: 1-16
## 默认: 1
max-connection-per-server=16

## 禁用 IPv6
## 值: true | false
## 默认: false
disable-ipv6=false

## 运行时守护进程化（后台运行）
## 值: true | false
## 默认: false
# daemon=false

## 暂停后添加下载。仅 RPC 模式有效
## 值: true | false
## 默认: false
# pause=false

## 暂停元数据下载所创建的后继下载。仅 RPC 模式有效
## 值: true | false
## 默认: false
# pause-metadata=false

## 静默模式（不输出到控制台）
## 值: true | false
## 默认: false
# quiet=false

# ======================== 2. 文件管理 ========================

## 文件预分配方式
##   none   - 不预分配，立即开始下载（推荐 SSD）
##   prealloc - 预先分配空间，大文件较慢（传统 HDD）
##   trunc    - 用 ftruncate 分配（依赖文件系统）
##   falloc   - 快速分配（推荐 ext4/btrfs/xfs/NTFS）
## 值: none | prealloc | trunc | falloc
## 默认: prealloc
file-allocation=none

## 小于此大小的文件不预分配
## 值: 0-*
## 默认: 5M
# no-file-allocation-limit=5M

## 下载完成后是否自动重命名同名文件（追加 .1, .2...）
## 值: true | false
## 默认: true
# auto-file-renaming=true

## 允许覆盖已存在的文件（配合 --allow-overwrite=true 从头重下）
## 值: true | false
## 默认: false
# allow-overwrite=false

## 下载前删除控制文件（*.aria2）。配合 --allow-overwrite=true 彻底重新下载
## 值: true | false
## 默认: false
# remove-control-file=false

## 设置下载文件的输出文件名（仅命令行直接指定的 URI）
## 值: /path/to/filename
# out=filename.zip

## 条件下载 — 仅在本地文件旧于远程时下载。功能有限，详见手册
## 值: true | false
## 默认: false
# conditional-get=false

## 获取远程文件时间戳并应用到本地文件
## 值: true | false
## 默认: false
# remote-time=false

## 磁盘缓存（减少磁盘 I/O，特别适合校验和下载）
## 0 表示禁用缓存
## 值: 0-* (可带 K/M)
## 默认: 16M
# disk-cache=16M

## 启用 mmap 文件映射（实验性）
## 值: true | false
## 默认: false
# enable-mmap=false

## mmap 最大文件限制（超过此大小不启用 mmap）
## 值: 0-*
## 默认: 9223372036854775807
# max-mmap-limit=9223372036854775807

# ======================== 3. 下载连接 ========================

## 连接超时（秒），建立连接后由 --timeout 接管
## 值: 1-600
## 默认: 60
connect-timeout=10

## 超时（秒），连接建立后的数据传输超时
## 值: 1-600
## 默认: 60
timeout=60

## 最大重试次数（0=不限）
## 值: 0-*
## 默认: 5
max-tries=5

## 重试间隔（秒）。>0 时 HTTP 503 也会重试
## 值: 0-600
## 默认: 0
retry-wait=5

## 最低速度限制（字节/秒），低于此值断开连接。0=不限
## 值: 0-* (可带 K/M)
## 默认: 0
# lowest-speed-limit=0

## 最大总下载速度（字节/秒），0=不限
## 值: 0-* (可带 K/M)
## 默认: 0
max-overall-download-limit=0

## 每个下载的最大下载速度 0=不限
## 值: 0-* (可带 K/M)
## 默认: 0
# max-download-limit=0

## 最大总上传速度 0=不限
## 值: 0-* (可带 K/M)
## 默认: 0
max-overall-upload-limit=500K

## 每个 torrent 的最大上传速度 0=不限
## 值: 0-* (可带 K/M)
## 默认: 0
max-upload-limit=500K

## URI 选择算法
##   inorder  - 按列表中顺序
##   feedback - 根据先前的下载速度选择最快服务器（推荐）
##   adaptive - 智能选择最优镜像
## 值: inorder | feedback | adaptive
## 默认: feedback
# uri-selector=feedback

## 流量片段选择算法（HTTP/FTP 流媒体下载时有用）
##   default - 减少连接建立次数（合理默认值）
##   inorder - 从文件开头选（适合边下边看视频）
##   random  - 随机选择
##   geom    - 指数间隔，开头密集（适合边下边看）
## 值: default | inorder | random | geom
## 默认: default
# stream-piece-selector=default

## 未使用的 URI 用完后是否复用已用过的
## 值: true | false
## 默认: true
# reuse-uri=true

## 恢复下载策略
## true  - 总是尝试恢复，失败则中止
## false - 恢复失败时从头重下
## 值: true | false
## 默认: true
# always-resume=true

## 最大恢复失败尝试次数（配合 --always-resume=false）
## 0 表示所有 URI 都不支持恢复时才重头开始
## 值: 0-*
## 默认: 0
# max-resume-failure-tries=0

## "文件未找到" 最大次数，超过则下载失败（0=不限制）
## 值: 0-*
## 默认: 0
# max-file-not-found=0

## 校验和设置（HTTP/FTP 下载）
## 格式: TYPE=DIGEST，如 sha-1=0192ba11326fe2298c8cb4de616f4d4140213838
## 支持类型: aria2c -v 查看支持的 hash 类型
# checksum=sha-1=0192ba11326fe2298c8cb4de616f4d4140213838

## 仅进行哈希校验，不下载文件
## 值: true | false
## 默认: false
# hash-check-only=false

## 校验文件完整性（BT/Metalink/checksum 模式）
## 值: true | false
## 默认: false
# check-integrity=false

## 文件分片长度（HTTP/FTP，影响拆分边界）
## 值: 1048576-1073741824
## 默认: 1M
# piece-length=1M

## 实时逐块校验（Metalink 带校验值时）
## 值: true | false
## 默认: true
# realtime-chunk-checksum=true

## 是否允许改变分片长度
## true  - 控制文件不匹配时继续下载（损失部分进度）
## false - 停止下载
## 值: true | false
## 默认: false
# allow-piece-length-change=false

## Dry-run 模式：只检查文件是否可下载，不实际下载
## 值: true | false
## 默认: false
# dry-run=false

# ======================== 4. 日志与进度 ========================

## 日志文件路径（- 表示输出到标准输出）
# log=/path/to/aria2.log

## 日志级别（影响到文件）
## 值: debug | info | notice | warn | error
## 默认: debug
log-level=notice

## 控制台输出日志级别（影响到终端显示）
## 值: debug | info | notice | warn | error
## 默认: notice
console-log-level=warn

## 日志文件路径（当前已启用）
log=/Users/dax/.config/aria2/aria2.log

## 下载摘要输出间隔（秒），0=禁用
## 值: 0-2147483647
## 默认: 60
# summary-interval=60

## 在控制台使用人类可读格式（1.2Ki, 3.4Mi）
## 值: true | false
## 默认: true
# human-readable=true

## 下载结果格式
##   default - 显示 GID、状态、平均速度、路径
##   full    - 显示 GID、状态、速度、进度、路径
##   hide    - 隐藏下载结果
## 值: default | full | hide
## 默认: default
# download-result=default

## 控制台读数截断为单行
## 值: true | false
## 默认: true
# truncate-console-readout=true

## 显示控制台读数
## 值: true | false
## 默认: true
# show-console-readout=true

## 保存到内存中的下载结果最大数（超过则丢弃最旧的）
## 0 表示不保存
## 值: 0-*
## 默认: 1000
# max-download-result=1000

## 保持未完成的下载结果（即使超过 max-download-result）
## 值: true | false
## 默认: true
# keep-unfinished-download-result=true

## 启用彩色输出（终端）
## 值: true | false
## 默认: true
# enable-color=true

## 将所有控制台输出重定向到 stderr
## 值: true | false
## 默认: false
# stderr=false

# ======================== 5. HTTP/FTP 专用 ========================

## HTTP 用户代理
## 默认: aria2/1.37.0
# user-agent=aria2/1.37.0

## HTTP 用户
# http-user=username

## HTTP 密码
# http-passwd=password

## FTP 用户
# ftp-user=anonymous

## FTP 密码
# ftp-passwd=anonymous@

## FTP 传输类型
## 值: binary | ascii
## 默认: binary
# ftp-type=binary

## FTP 被动模式
## 值: true(pasv) | false(active)
## 默认: true
# ftp-pasv=true

## 复用 FTP 连接
## 值: true | false
## 默认: true
# ftp-reuse-connection=true

## SFTP 主机公钥校验
## 格式: sha-1=hexdigest 或 md5=hexdigest
# ssh-host-key-md=sha-1=b030503d4de4539dc7885e6f0f5e256704edf4c3

## 加载 Cookies 文件（Firefox/Netscape 格式）
# load-cookies=/path/to/cookies.txt

## 保存 Cookies 到文件
# save-cookies=/path/to/cookies.txt

## 附加自定义 HTTP 请求头
# header=X-Custom: value

## 使用 HEAD 方法先请求服务器
## 值: true | false
## 默认: false
# use-head=false

## 仅当服务器要求时发送认证头
## 值: true | false
## 默认: false
# http-auth-challenge=false

## 发送 Cache-Control: no-cache 等避免缓存
## 值: true | false
## 默认: false
# http-no-cache=false

## 发送 Accept-Encoding: deflate, gzip 并自动解压
## 值: true | false
## 默认: false
# http-accept-gzip=false

## Content-Disposition 中带引号的字符串视作 UTF-8
## 值: true | false
## 默认: false
# content-disposition-default-utf8=false

## 禁用 Want-Digest 请求头
## 值: true | false
## 默认: false
# no-want-digest-header=false

## HTTP/1.1 keep-alive
## 值: true | false
## 默认: true
# enable-http-keep-alive=true

## HTTP/1.1 pipelining（流水线）
## 值: true | false
## 默认: false
# enable-http-pipelining=false

## HTTPS 证书验证（检查服务器证书有效性）
## 值: true | false
## 默认: true
# check-certificate=true

## CA 证书文件（PEM 格式）
# ca-certificate=/path/to/ca-certificates.crt

## 客户端证书（PEM 格式）
# certificate=/path/to/cert.pem

## 客户端私钥（PEM 格式，未加密）
# private-key=/path/to/key.pem

## HTTP Referer 来源地址（* 表示使用下载 URI 本身）
# referer=*

## netrc 文件路径
## 默认: $(HOME)/.netrc
# netrc-path=$(HOME)/.netrc

## 禁用 netrc 支持
## 值: true | false
## 默认: false
# no-netrc=false

## 最小 TLS 版本
## 值: TLSv1.1 | TLSv1.2 | TLSv1.3
## 默认: TLSv1.2
# min-tls-version=TLSv1.2

# ======================== 6. 代理设置 ========================

## 为所有协议设置代理（格式: http://[USER:PASS@]HOST:PORT）
all-proxy=http://localhost:1081

## HTTP 代理
# http-proxy=http://proxy.example.com:8080

## HTTPS 代理
# https-proxy=http://proxy.example.com:8080

## FTP 代理
# ftp-proxy=http://proxy.example.com:8080

## 代理认证用户名/密码
# all-proxy-user=username
# all-proxy-passwd=password
# http-proxy-user=username
# http-proxy-passwd=password
# https-proxy-user=username
# https-proxy-passwd=password
# ftp-proxy-user=username
# ftp-proxy-passwd=password

## 不使用代理的域名/IP（逗号分隔）
# no-proxy=localhost,127.0.0.1,192.168.0.0/16

## 代理请求方法
##   get    - GET 方法
##   tunnel - CONNECT 隧道（HTTPS 下载始终用 tunnel）
## 值: get | tunnel
## 默认: get
# proxy-method=get

# ======================== 7. RPC 设置 ========================

## 启用 RPC 服务（JSON-RPC/XML-RPC）
## 值: true | false
## 默认: false
enable-rpc=true

## 监听所有网络接口（false=仅 loopback）
## 值: true | false
## 默认: false
rpc-listen-all=true

## 允许所有来源的跨域请求（Access-Control-Allow-Origin: *）
## 值: true | false
## 默认: false
rpc-allow-origin-all=true

## RPC 监听端口
## 值: 1024-65535
## 默认: 6800
# rpc-listen-port=6800

## RPC 秘密授权令牌（强烈建议设置！比 user/passwd 更安全）
rpc-secret=dax

## RPC 最大请求大小
## 值: 0-*
## 默认: 2M
# rpc-max-request-size=2M

## RPC SSL/TLS 加密（需配合 rpc-certificate + rpc-private-key）
## 值: true | false
## 默认: false
# rpc-secure=false

## RPC 证书文件（PEM 格式，需配合 --rpc-secure）
# rpc-certificate=/path/to/cert.pem

## RPC 私钥文件（PEM 格式，未加密，需配合 --rpc-secure）
# rpc-private-key=/path/to/key.pem

## 保存通过 RPC 上传的 torrent/metalink 元数据到磁盘
## false 时，通过 RPC 添加的下载不会被 --save-session 保存
## 值: true | false
## 默认: true
# rpc-save-upload-metadata=true

# ======================== 8. 会话管理 ========================

## 会话保存文件（退出时保存未完成/出错的任务，重启时载入）
save-session=/Users/dax/.config/aria2/aria2.session

## 会话输入文件（启动时载入已保存的会话）
input-file=/Users/dax/.config/aria2/aria2.session

## 自动保存会话的间隔（秒），0 表示仅退出时保存
## 值: 0-*
## 默认: 0
save-session-interval=0

## 自动保存控制文件（*.aria2）的间隔（秒），0 表示下载中不保存
## 值: 0-600
## 默认: 60
# auto-save-interval=60

## 即使下载完成或已删除也保存到会话文件
## 值: true | false
## 默认: false
# force-save=false

## 即使文件在服务器上找不到也保存到会话文件
## 值: true | false
## 默认: true
# save-not-found=true

## 延迟加载输入文件（启动时不读取所有 URI，需要时逐个读取）
## 适合输入文件有大量 URI 时节省内存
## 值: true | false
## 默认: false
# deferred-input=false

## 在指定秒数后停止 aria2
## 值: 0-2147483647
## 默认: 0(不停止)
# stop=0

## GID 手动设置（格式: 16 位 hex 字符串）。恢复会话时有用。
# gid=0123456789abcdef

## 与父进程 PID 绑定，父进程退出时 aria2 自动退出
# stop-with-process=PID

# ======================== 9. BT — 端口与连接 ========================

## BitTorrent 监听 TCP 端口（支持逗号和范围）
## 值: 1024-65535
## 默认: 6881-6999
# listen-port=6881-6999

## 每个 torrent 最大 peer 数（0=不限）
## 值: 0-*
## 默认: 55
bt-max-peers=256

## 当总下载速度低于此值时，临时增加 peer 数以提升速度
## 值: 0-* (可带 K/M)
## 默认: 50K
bt-request-peer-speed-limit=10M

## 多文件 BT/Metalink 下载中最大打开文件数
## 值: 1-*
## 默认: 100
bt-max-open-files=1000

## BT 外部 IP 地址（用于 DHT 和 tracker 报告）
# bt-external-ip=123.123.123.123

## DSCP 值（QoS 标记，IP 包 TOS 字段）
## 值: 0-*
## 默认: 0
# dscp=0

## 文件描述符上限（软限制）
## 值: 1-*
## 默认: 1024
# rlimit-nofile=1024

## 最大套接字接收缓冲区（字节），0=禁用
## 值: 0-16777216
## 默认: 0
# socket-recv-buffer-size=0

## 绑定到指定的网络接口（接口名/IP/主机名）
# interface=eth0

## 多接口绑定（逗号分隔），请求在多个接口间分配以实现链路聚合
# multiple-interface=eth0,wlan0

## BT 本地 Peer 发现接口
# bt-lpd-interface=eth0

# ======================== 10. BT — DHT ========================

## 启用 IPv4 DHT（磁力链接依赖此功能）
## 值: true | false
## 默认: true
enable-dht=true

## 启用 IPv6 DHT
## 值: true | false
## 默认: false
enable-dht6=true

## DHT UDP 监听端口（同 UDP tracker 共用）
## 值: 1024-65535
## 默认: 6881-6999
dht-listen-port=6881-6999

## IPv6 DHT 监听地址（须为全球单播 IPv6 地址）
# dht-listen-addr6=2001:db8::1

## IPv4 DHT 路由表文件
dht-file-path=/Users/dax/.config/aria2/dht.dat

## IPv6 DHT 路由表文件
dht-file-path6=/Users/dax/.config/aria2/dht6.dat

## DHT 消息超时（秒）
## 值: 1-60
## 默认: 10
dht-message-timeout=15

## DHT 网络入口点（可设置多个）
## 格式: HOST:PORT
dht-entry-point=router.bittorrent.com:6881
dht-entry-point6=router.bittorrent.com:6881
dht-entry-point=dht.transmissionbt.com:6881
dht-entry-point=dht.libtorrent.org:25401

# ======================== 11. BT — Tracker ========================

## 额外的 tracker 服务器列表（逗号分隔）
## 格式: URI,URI,...
bt-tracker=udp://zer0day.ch:1337/announce,udp://tracker.publictracker.xyz:6969/announce,http://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,udp://yuptracker-eu.gaijinent.com:27022/announce,udp://tracker2.dler.org:80/announce,udp://tracker.wildkat.net:6969/announce,udp://tracker.qu.ax:6969/announce,udp://tracker.opentorrent.top:6969/announce,udp://tracker.filemail.com:6969/announce,udp://tracker.ducks.party:1984/announce,udp://tracker.corpscorp.online:80/announce,udp://tracker.bluefrog.pw:2710/announce,udp://tracker.bittor.pw:1337/announce,udp://tracker.auctor.tv:6969/announce,udp://tracker.004430.xyz:1337/announce,udp://tracker-udp.gbitt.info:80/announce

## 需要删除的 tracker（* 表示全部删除）
## 格式: URI,... 或 *
# bt-exclude-tracker=*

## Tracker 请求间隔（秒）。0=使用 tracker 返回的间隔
## 值: 0-*
## 默认: 0
# bt-tracker-interval=0

## Tracker 连接超时（秒）
## 值: 1-600
## 默认: 60
bt-tracker-connect-timeout=10

## Tracker 超时（秒）
## 值: 1-600
## 默认: 60
# bt-tracker-timeout=60

# ======================== 12. BT — Peer 与本地发现 ========================

## 启用本地 Peer 发现（LPD — Local Peer Discovery）
## 值: true | false
## 默认: false
bt-enable-lpd=true

## 启用 Peer 交换扩展（PEX — Peer Exchange）
## 值: true | false
## 默认: true
enable-peer-exchange=true

## Peer ID 前缀（共 20 字节，超过截断，不足随机填充）
## 默认: A2-1-37-0-
# peer-id-prefix=A2-1-37-0-

## Peer 代理（扩展握手时报告的客户端名）
## 默认: aria2/1.37.0
# peer-agent=aria2/1.37.0

# ======================== 13. BT — 加密 ========================

## 强制加密（= --bt-require-crypto=true + --bt-min-crypto-level=arc4）
## 启用后拒绝旧版握手，强制混淆 + 加密
## 值: true | false
## 默认: false
bt-force-encryption=true

## 要求加密（true 时仅使用带混淆的握手）
## 值: true | false
## 默认: false
bt-require-crypto=false

## 最低加密等级
##   plain - 不强制加密（兼容最好）
##   arc4  - 至少要求 ARC4 加密
## 值: plain | arc4
## 默认: plain
bt-min-crypto-level=arc4

# ======================== 14. BT — 做种与上传 ========================

## 做种时间（分钟）。达到后停止做种。0=不做种
## 值: 0.0-*
# seed-time=0

## 做种分享率。达到后停止做种。0.0=不限，1.0=分享 100%
## seed-time 和 seed-ratio 任一先达到则停止
## 值: 0.0-*
## 默认: 1.0
seed-ratio=0.0

## 做种前不验证文件片段哈希（跳过校验直接做种）
## 值: true | false
## 默认: false
# bt-seed-unverified=false

## 哈希校验后若文件完整则继续做种
## false 时仅当文件损坏才检查并重下
## 值: true | false
## 默认: true
# bt-hash-check-seed=true

## 分离只做种的任务（不计入活动下载计数 -j）
## true 时做种任务不占用并行下载槽位
## 值: true | false
## 默认: false
# bt-detach-seed-only=false

## 移除未选择的文件（下载完成后删除未勾选的文件）
## 值: true | false
## 默认: false
# bt-remove-unselected-file=false

# ======================== 15. BT — 其他 ========================

## 保存元数据为 .torrent 文件（磁力链接下载时）
## 值: true | false
## 默认: false
bt-save-metadata=true

## 仅下载元数据，不下载文件内容（配合上方 bt-save-metadata）
## 值: true | false
## 默认: false
# bt-metadata-only=false

## 优先下载每个文件的起始和结尾片段（便于预览）
## 格式: head[=SIZE],tail[=SIZE] 如 head=1M,tail=1M
## 不指定大小时默认 1M
# bt-prioritize-piece=head=1M,tail=1M

## BT 下载速度为 0 持续 N 秒后停止（0=禁用）
## 值: 0-*
## 默认: 0
# bt-stop-timeout=0

## 文件索引输出（设置单个文件路径）
## 格式: INDEX=PATH，如 1=subdir/file.mp4
# index-out=1=subdir/file.mp4

## 选择要下载的文件索引（多个用逗号或范围）
## 使用 --show-files 查看可用索引
## 示例: --select-file=1,3,5-8
# select-file=1,3,5-8

## 下载 .torrent 文件后将其作为种子解析并下载内容
##   true - 解析并下载（默认）
##   mem  - 不写入磁盘，仅存内存中
##   false - 只下载 .torrent 文件本身
## 值: true | mem | false
## 默认: true
# follow-torrent=true

## 启动时先尝试从本地已保存的 .torrent 文件加载磁力链元数据
## 如果成功则跳过 DHT 元数据下载
## 值: true | false
## 默认: false
# bt-load-saved-metadata=false

## 在 BT 哈希校验后允许执行钩子命令
## 值: true | false
## 默认: true
# bt-enable-hook-after-hash-check=true

# ======================== 16. BT — 文件列表查看 ========================

## 打印 torrent/metalink 文件内容列表后退出
## 值: true | false
## 默认: false
# show-files=false

## torrent 文件路径
# torrent-file=/path/to/file.torrent

# ======================== 17. Metalink ========================

## Metalink 文件路径（.meta4/.metalink）
# metalink-file=/path/to/file.meta4

## 下载 .meta4/.metalink 文件后解析并下载其中内容
## 值: true | mem | false
## 默认: true
# follow-metalink=true

## Metalink 文件版本
# metalink-version=1.0

## Metalink 文件语言
# metalink-language=en

## Metalink 目标操作系统
# metalink-os=linux

## 首选服务器位置（逗号分隔多个）
# metalink-location=jp,us,eu

## 首选协议
## 值: http | https | ftp | none
## 默认: none
# metalink-preferred-protocol=none

## 如果 metalink 中的镜像支持多协议，只用其中一个
## 值: true | false
## 默认: true
# metalink-enable-unique-protocol=true

## Metalink 基础 URI（用于解析 metalink 中的相对 URI）
# metalink-base-uri=http://mirror.example.com/files/

# ======================== 18. 事件钩子 ========================

## 下载开始时执行的命令
## aria2 传递 3 个参数: GID, 文件数量, 文件路径
# on-download-start=/path/to/script.sh

## 下载暂停时执行的命令
# on-download-pause=/path/to/script.sh

## 下载完成时执行的命令
on-download-complete=/Users/dax/.config/aria2/cleanup-aria2-hook.sh

## 下载出错时执行的命令
# on-download-error=/path/to/script.sh

## 下载停止时执行的命令（无论是完成还是出错）
## 如果指定了 on-download-complete 或 on-download-error，则不会被调用
# on-download-stop=/path/to/script.sh

## BT 下载内容下载完成后（开始做种前）执行的命令
# on-bt-download-complete=/path/to/script.sh

# ======================== 19. 高级 / 网络 ========================

## 异步 DNS（可提高域名解析速度）
## 值: true | false
## 默认: true
async-dns=false

## 启用异步 IPv6 DNS（需要 --async-dns=true）
## 值: true | false
# enable-async-dns6=false

## 异步 DNS 服务器列表（逗号分隔），默认使用 /etc/resolv.conf
# async-dns-server=8.8.8.8,1.1.1.1

## 事件轮询方法
## 值: kqueue | poll | select
## 默认: kqueue
# event-poll=kqueue

## 不使用配置文件
## 值: true | false
## 默认: false
# no-conf=false

## 配置文件路径
## 默认: $(HOME)/.config/aria2/aria2.conf
# conf-path=$(HOME)/.config/aria2/aria2.conf

## 根据带宽优化并发下载数
## 格式: true | false | A:B（A、B为公式系数）
## 公式: N = A + B * Log10(速度 Mbps)
## 默认系数: A=5, B=25（1Mbps≈5并行，100Mbps≈50并行）
## 值: true | false | A:B
## 默认: false
# optimize-concurrent-downloads=false

# ======================== 20. 杂项 ========================

## 镜像多源下载（从命令行依次获取链接同时下载）
## 值: true | false
## 默认: false
# force-sequential=false

## 按需自动重命名同名文件（.1, .2 后缀）
## 已包含在文件管理部分，再次列出供参考
# auto-file-renaming=true

## 版本号（仅用于查看）
# version=false

## 帮助信息（仅用于查看）
# help=#basic
